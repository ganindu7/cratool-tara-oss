# Runs on every pull request and on every change to main: the same checks as `npm run check`,
# on the oldest and the newest Node.js the tool supports, plus the build of the screens, the image and the site.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The screens, used in a real browser. Chrome comes with the runner.
      - run: npm run check:browser
      - run: npm run site

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Known vulnerabilities in what ships with the tool fail the build; those in build tools are reported.
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=high || true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t tara-workbench .
      # The image must start, answer, and be healthy by its own check.
      - run: |
          docker run -d --name tara -p 127.0.0.1:8787:8787 -e TARA_ALLOWED_HOSTS=localhost tara-workbench
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8787/api/health && exit 0
            sleep 1
          done
          docker logs tara
          exit 1
