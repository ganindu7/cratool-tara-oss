# Publishes the website to GitHub Pages whenever the documentation, the site or the pictures change on main.
# The pages are built from docs/*.md as they are in the repository: there is no second copy to keep in step.
#
# One-time setup in the repository's settings: Pages, "Build and deployment", Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths: ["docs/**", "site/**", "README.md", "CHANGELOG.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time; a newer one replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      # Every link of the site is relative, so it works under whatever address Pages gives it.
      # Links to files of the repository lead to the repository this workflow runs in.
      - run: npm run site
        env:
          SITE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
